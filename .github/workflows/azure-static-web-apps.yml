name: Build store front (VM alternative)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    env:
      VUE_APP_ORDER_SERVICE_URL: ${{ vars.VUE_APP_ORDER_SERVICE_URL }}
      VUE_APP_PRODUCT_SERVICE_URL: ${{ vars.VUE_APP_PRODUCT_SERVICE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check API configuration
        run: |
          test -n "$VUE_APP_ORDER_SERVICE_URL"
          test -n "$VUE_APP_PRODUCT_SERVICE_URL"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Save production build
        uses: actions/upload-artifact@v4
        with:
          name: store-front-dist
          path: dist
      - name: Explain approved VM hosting
        if: vars.AZURE_STATIC_WEB_APPS_DEPLOYMENT_ENABLED != 'true'
        run: echo 'Build verified. The frontend uses the instructor-approved Azure VM alternative. This workflow saves an artifact; it does not deploy to the VM.' >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy to Azure Static Web Apps
        if: vars.AZURE_STATIC_WEB_APPS_DEPLOYMENT_ENABLED == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true
